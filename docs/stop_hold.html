<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
</head>
<body>
<title>停车保持的门槛</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: three sliders with their thresholds drawn on the track; a big state lamp; a scripted "lead car creeps then starts" timeline showing hysteresis. */
:root {
  --bg: #eef1f4; --surface: #ffffff; --ink: #1b222a; --muted: #5b6672; --line: #d5dce3; --chip: #f5f7f9;
  --enter: #1e66d6; --exit: #e07400; --hold: #c4471f; --free: #1a9a6c; --track: #e3e7ec;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161b; --surface: #182029; --ink: #e5eaf0; --muted: #9aa5b1; --line: #2a343e; --chip: #1f2832;
    --enter: #62a6ff; --exit: #ffa040; --hold: #ff8a5c; --free: #3fd29a; --track: #26303a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161b; --surface: #182029; --ink: #e5eaf0; --muted: #9aa5b1; --line: #2a343e; --chip: #1f2832;
  --enter: #62a6ff; --exit: #ffa040; --hold: #ff8a5c; --free: #3fd29a; --track: #26303a; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1000px; margin: 0 auto; display: grid; gap: 16px; }
h1 { font-size: 24px; margin: 0; }
h2 { font-size: 16px; margin: 0 0 8px; }
.lede { margin: 4px 0 0; color: var(--muted); max-width: 74ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.top { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .top { grid-template-columns: minmax(0, 1fr); } }
.sl { display: grid; gap: 2px; margin-bottom: 14px; }
.sl .hd { display: flex; justify-content: space-between; font-size: 14px; }
.sl .hd .n { font-family: var(--font-num); font-weight: 600; }
.sl input { width: 100%; accent-color: var(--ink); }
svg { display: block; width: 100%; height: auto; }
.lamp { border-radius: 12px; padding: 16px; text-align: center; font-weight: 700; font-size: 20px; color: var(--surface); }
.lamp.hold { background: var(--hold); } .lamp.free { background: var(--free); }
.lamp small { display: block; font-weight: 400; font-size: 13px; opacity: .95; }
.conds { display: grid; gap: 6px; margin-top: 12px; font-size: 14px; }
.conds div { background: var(--chip); border-radius: 6px; padding: 6px 8px; }
.ok { color: var(--free); font-weight: 700; } .no { color: var(--hold); font-weight: 700; }
.mem { font-size: 13px; color: var(--muted); margin-top: 8px; }
button { font: 500 13px var(--font-body); color: var(--ink); background: var(--chip); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--enter); outline-offset: 2px; }
.lbl { font: 500 12px var(--font-body); fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }
.ax { font: 400 11px var(--font-num); fill: var(--muted); }
</style>

<div class="wrap">
  <header>
    <h1>停车保持的门槛</h1>
    <p class="lede">拖三个滑块，看 <code>StopHold.update</code> 每一步怎么判断。<b style="color: var(--enter)">蓝线</b>是进入门槛，<b style="color: var(--exit)">橙线</b>是退出门槛。同样的数，状态灯亮不亮还要看上一帧在不在保持（holding）。</p>
  </header>

  <section class="top">
    <div class="panel">
      <div class="sl"><div class="hd"><span>我的车速 speed_mps</span><span class="n" id="vS">0.20 m/s</span></div><input type="range" id="s" min="0" max="5" step="0.05" value="0.2"><svg id="tS" viewBox="0 0 600 34"></svg></div>
      <div class="sl"><div class="hd"><span>前车车速 lead_speed_mps</span><span class="n" id="vL">0.00 m/s</span></div><input type="range" id="l" min="0" max="3" step="0.05" value="0"><svg id="tL" viewBox="0 0 600 34"></svg></div>
      <div class="sl"><div class="hd"><span>车距 gap_m</span><span class="n" id="vG">6.0 米</span></div><input type="range" id="g" min="3" max="20" step="0.1" value="6"><svg id="tG" viewBox="0 0 600 34"></svg></div>
      <button type="button" id="play">播放：前车先往前蹭到 0.8，又停下，再真起步到 1.5</button>
    </div>
    <div class="panel">
      <div class="lamp" id="lamp"></div>
      <div class="conds" id="conds"></div>
      <p class="mem" id="mem"></p>
    </div>
  </section>

  <section class="panel">
    <h2>前车车速随时间变化时，保持状态怎么变（同一段剧本，单门槛 vs 双门槛）</h2>
    <svg id="tl" viewBox="0 0 900 250" aria-label="时间轴：前车车速曲线，两条门槛线，下面两条状态带"></svg>
  </section>
</div>

<script>
(function () {
  "use strict";
  var P = { enter_speed: 1.0, enter_lead: 0.5, enter_gap: 8.0, exit_lead: 1.0, exit_gap: 11.0 };
  var st = { s: 0.2, l: 0, g: 6, holding: false };
  var $ = function (id) { return document.getElementById(id); };
  var NS = "http://www.w3.org/2000/svg";
  function mk(tag, a, p) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; }
  function track(id, min, max, marks, val) {
    var svg = $(id); svg.innerHTML = "";
    var X = function (v) { return 10 + (v - min) / (max - min) * 580; };
    mk("rect", { x: 10, y: 14, width: 580, height: 6, rx: 3, style: "fill: var(--track)" }, svg);
    marks.forEach(function (m) {
      mk("line", { x1: X(m.v), y1: 6, x2: X(m.v), y2: 28, style: "stroke: var(" + m.c + "); stroke-width: 3" }, svg);
      mk("text", { "class": "lbl", x: X(m.v) + 4, y: 11, style: "fill: var(" + m.c + ")" }, svg).textContent = m.t;
    });
    mk("circle", { cx: X(val), cy: 17, r: 6, style: "fill: var(--ink)" }, svg);
  }
  function step(s, l, g, holding) {        // same logic as StopHold.update
    if (holding) { if (l > P.exit_lead || g > P.exit_gap) holding = false; }
    else if (s < P.enter_speed && l < P.enter_lead && g < P.enter_gap) holding = true;
    return holding;
  }
  function render(prev) {
    $("vS").textContent = st.s.toFixed(2) + " m/s"; $("vL").textContent = st.l.toFixed(2) + " m/s"; $("vG").textContent = st.g.toFixed(1) + " 米";
    track("tS", 0, 5, [{ v: P.enter_speed, c: "--enter", t: "进入：< 1.0" }], st.s);
    track("tL", 0, 3, [{ v: P.enter_lead, c: "--enter", t: "进入：< 0.5" }, { v: P.exit_lead, c: "--exit", t: "退出：> 1.0" }], st.l);
    track("tG", 3, 20, [{ v: P.enter_gap, c: "--enter", t: "进入：< 8" }, { v: P.exit_gap, c: "--exit", t: "退出：> 11" }], st.g);
    var was = st.holding;
    st.holding = step(st.s, st.l, st.g, st.holding);
    var lamp = $("lamp");
    lamp.className = "lamp " + (st.holding ? "hold" : "free");
    lamp.innerHTML = st.holding ? "停车保持中<small>踩住刹车，不踩油门；PID 积分清零，影子车车速 = 0</small>" : "正常开（PID 管）<small>IDM → 影子车 → PID</small>";
    var c = "";
    if (was) {
      c += "<div>上一帧在保持，只检查<b>要不要松开</b>（满足一个就松）：</div>";
      c += "<div>前车 " + st.l.toFixed(2) + " &gt; 1.0？ <span class='" + (st.l > 1 ? "ok'>是" : "no'>否") + "</span></div>";
      c += "<div>车距 " + st.g.toFixed(1) + " &gt; 11？ <span class='" + (st.g > 11 ? "ok'>是" : "no'>否") + "</span></div>";
    } else {
      c += "<div>上一帧没在保持，只检查<b>要不要进入</b>（三个都满足才进）：</div>";
      c += "<div>我 " + st.s.toFixed(2) + " &lt; 1.0？ <span class='" + (st.s < 1 ? "ok'>是" : "no'>否") + "</span></div>";
      c += "<div>前车 " + st.l.toFixed(2) + " &lt; 0.5？ <span class='" + (st.l < 0.5 ? "ok'>是" : "no'>否") + "</span></div>";
      c += "<div>车距 " + st.g.toFixed(1) + " &lt; 8？ <span class='" + (st.g < 8 ? "ok'>是" : "no'>否") + "</span></div>";
    }
    $("conds").innerHTML = c;
    $("mem").textContent = "holding：上一帧 " + (was ? "True" : "False") + " → 这一帧 " + (st.holding ? "True" : "False") + "。这就是 dataclass 里那个 holding 字段，它让类“记得”上一帧。";
  }
  ["s", "l", "g"].forEach(function (k) { $(k).addEventListener("input", function (e) { st[k] = +e.target.value; render(); }); });

  // timeline: scripted lead speed
  var T = [], L = [];
  for (var i = 0; i <= 180; i++) {
    var t = i / 10, l;
    if (t < 3) l = 0; else if (t < 6) l = 0.8 * (t - 3) / 3; else if (t < 7) l = 0.8; else if (t < 9) l = 0.8 - 0.8 * (t - 7) / 2;
    else if (t < 11) l = 0; else if (t < 15) l = 1.5 * (t - 11) / 4; else l = 1.5;
    l += 0.06 * Math.sin(t * 7);                        // a little sensor jitter
    T.push(t); L.push(Math.max(0, l));
  }
  function drawTimeline() {
    var svg = $("tl"); svg.innerHTML = "";
    var X = function (t) { return 60 + t / 18 * 820; }, Y = function (v) { return 140 - v / 1.8 * 120; };
    mk("rect", { x: 0, y: 0, width: 900, height: 250, style: "fill: var(--surface)" }, svg);
    [[0.5, "--enter", "进入门槛 0.5"], [1.0, "--exit", "退出门槛 1.0"]].forEach(function (m) {
      mk("line", { x1: 60, y1: Y(m[0]), x2: 880, y2: Y(m[0]), style: "stroke: var(" + m[1] + "); stroke-dasharray: 6 4; stroke-width: 1.5" }, svg);
      mk("text", { "class": "lbl", x: 64, y: Y(m[0]) - 4, style: "fill: var(" + m[1] + ")" }, svg).textContent = m[2];
    });
    var d = T.map(function (t, i) { return (i ? "L" : "M") + X(t).toFixed(1) + " " + Y(L[i]).toFixed(1); }).join("");
    mk("path", { d: d, style: "fill: none; stroke: var(--ink); stroke-width: 2" }, svg);
    mk("text", { "class": "ax", x: 6, y: Y(1.5) }, svg).textContent = "前车 m/s";
    for (var s = 0; s <= 18; s += 3) mk("text", { "class": "ax", x: X(s), y: 246, "text-anchor": "middle" }, svg).textContent = s + " 秒";
    // two state bands: single threshold (0.5 in and out) vs hysteresis (0.5 in, 1.0 out); ego stopped, gap 6
    function band(y, label, fn) {
      mk("text", { "class": "lbl", x: 4, y: y + 13 }, svg).textContent = label;
      var h = false, switches = 0;
      for (var i = 0; i < T.length - 1; i++) {
        var nh = fn(h, L[i]); if (nh !== h && i > 0) switches++; h = nh;
        mk("rect", { x: X(T[i]), y: y, width: X(T[i + 1]) - X(T[i]) + 0.5, height: 18, style: "fill: var(" + (h ? "--hold" : "--free") + ")" }, svg);
      }
      mk("text", { "class": "lbl", x: 884, y: y + 13, "text-anchor": "end" }, svg).textContent = "切换 " + switches + " 次";
    }
    band(160, "单门槛", function (h, l) { return h ? !(l > 0.5) : (l < 0.5); });
    band(190, "双门槛", function (h, l) { return h ? !(l > 1.0) : (l < 0.5); });
    mk("text", { "class": "ax", x: 60, y: 226 }, svg).textContent = "红 = 停车保持，绿 = 正常开（我停着、车距 6 米不变，只看前车车速）";
  }
  drawTimeline();

  var timer = null;
  $("play").addEventListener("click", function () {
    if (timer) { clearInterval(timer); timer = null; }
    var i = 0; st.s = 0; st.g = 6; st.holding = false; $("s").value = 0; $("g").value = 6;
    timer = setInterval(function () {
      st.l = Math.round(L[i] * 100) / 100; $("l").value = st.l; render();
      i += 1; if (i >= L.length) { clearInterval(timer); timer = null; }
    }, 60);
  });
  render();
})();
</script>

</body>
</html>
