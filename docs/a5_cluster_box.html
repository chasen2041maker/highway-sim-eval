<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
</head>
<body>
<title>一堆点怎么画框</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: step list on the left, a top-view canvas on the right (stacked on phones); the canvas zooms from the whole scene into one cluster and sweeps x, then y, to build the box. */
:root {
  --bg: #eef1f4; --surface: #ffffff; --ink: #1b222a; --muted: #5b6672; --line: #d5dce3; --chip: #f5f7f9;
  --accent: #1e66d6; --accent-ink: #ffffff; --grid: #e6eaee; --axis: #b9c2cc;
  --xcol: #1e66d6; --ycol: #9a3fc4; --warn: #d23b3b; --ego: #c9d0d8;
  --c0: #2a78d6; --c1: #d23b3b; --c2: #1a9a6c; --c3: #9a3fc4; --c4: #d96f00;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161b; --surface: #182029; --ink: #e5eaf0; --muted: #9aa5b1; --line: #2a343e; --chip: #1f2832;
    --accent: #62a6ff; --accent-ink: #11161b; --grid: #222b34; --axis: #3a4652;
    --xcol: #62a6ff; --ycol: #c77dff; --warn: #ff6b6b; --ego: #34404c;
    --c0: #5aa2ff; --c1: #ff6b6b; --c2: #3fd29a; --c3: #c77dff; --c4: #ffa040; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161b; --surface: #182029; --ink: #e5eaf0; --muted: #9aa5b1; --line: #2a343e; --chip: #1f2832;
  --accent: #62a6ff; --accent-ink: #11161b; --grid: #222b34; --axis: #3a4652;
  --xcol: #62a6ff; --ycol: #c77dff; --warn: #ff6b6b; --ego: #34404c;
  --c0: #5aa2ff; --c1: #ff6b6b; --c2: #3fd29a; --c3: #c77dff; --c4: #ffa040; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 14px; }
h1 { font-size: 24px; margin: 0; text-wrap: balance; }
h2 { font-size: 16px; margin: 0; }
p { margin: 0; }
.lede { margin-top: 4px; color: var(--muted); max-width: 76ch; }
.num, .readout b { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 14px; align-items: start; }
@media (max-width: 880px) { .main { grid-template-columns: minmax(0, 1fr); } .main .stage { order: -1; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
#steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; counter-reset: s; }
#steps li { counter-increment: s; padding: 8px 10px 8px 34px; border-radius: 8px; position: relative; cursor: pointer; color: var(--muted); font-size: 14px; }
#steps li::before { content: counter(s); position: absolute; left: 8px; top: 8px; width: 19px; height: 19px; border-radius: 50%; border: 1px solid var(--line); font-family: var(--font-num); font-size: 12px; line-height: 17px; text-align: center; }
#steps li b { color: var(--ink); font-weight: 700; }
#steps li[aria-current="step"] { background: var(--chip); color: var(--ink); }
#steps li[aria-current="step"]::before { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
#steps li:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
canvas { display: block; width: 100%; border-radius: 6px; background: var(--surface); }
.controls { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.btn { font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
#stepno { margin-left: auto; color: var(--muted); font-size: 13px; }
.readout { font-size: 14.5px; min-height: 2.8em; }
.memo { border-left: 3px solid var(--accent); padding-left: 12px; }
.memo p + p { margin-top: 4px; color: var(--muted); font-size: 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 6px; border-radius: 2px; }
</style>

<div class="wrap">
  <header>
    <h1>一堆点怎么画框</h1>
    <p class="lede">俯视图：x 朝前、y 朝左，原点 = 车顶上的雷达，单位米。点是假雷达扫一圈、去完地面（门槛 −1.6）、DBSCAN（eps 1.0、min_samples 5）分完堆的真实数据，和你跑的一样。</p>
  </header>

  <div class="chips" role="group" aria-label="选一堆">
    <button class="chip" id="pick-parked" data-pick="parked" aria-pressed="true">第 4 堆：路边停的车</button>
    <button class="chip" id="pick-ped" data-pick="ped" aria-pressed="false">第 2 堆：行人</button>
    <button class="chip" id="pick-toy" data-pick="toy" aria-pressed="false">示意：6 个整数点（好心算）</button>
  </div>

  <div class="main">
    <section class="panel">
      <h2>一步一步</h2>
      <ol id="steps"></ol>
    </section>
    <section class="panel stage">
      <canvas id="cv" aria-label="俯视图：点、扫描线和框"></canvas>
      <div class="legend">
        <span><i style="background:var(--xcol)"></i>x 方向（往前）</span>
        <span><i style="background:var(--ycol)"></i>y 方向（往左）</span>
        <span><i style="background:var(--ink)"></i>算出来的框</span>
        <span><i style="background:var(--warn)"></i>“最近点 ↔ 最远点”</span>
      </div>
      <div class="controls">
        <button class="btn" id="prev">上一步</button>
        <button class="btn" id="replay">重播这一步</button>
        <button class="btn primary" id="next">下一步</button>
        <span id="stepno" class="num"></span>
      </div>
      <p id="readout" class="readout" aria-live="polite"></p>
    </section>
  </div>

  <section class="panel memo">
    <h2>一句话记住</h2>
    <p>x 和 y 分开看，各找最小和最大：<b>中心 = 两头的正中间，长和宽 = 大 − 小</b>。一堆点变成一行 4 个数，K 堆就是 K 行；噪声（−1）不算一堆。</p>
    <p>这个框的边和 x、y 轴平行（不带朝向），叫“轴对齐框”。</p>
  </section>
</div>

  ctx.fillStyle = C.muted; ctx.textAlign = "right"; ctx.textBaseline = "bottom";
  ctx.fillText("x（米，往前）→", W - 6, H - 16);
  ctx.textAlign = "left"; ctx.textBaseline = "top"; ctx.fillText("↑ y（米，往左）", 30, 4);
}

function drawEgo(T) {
  if (pick === "toy") {
    ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(T.X(0), T.Y(0), 4, 0, Math.PI * 2); ctx.fill();
    tag("原点 = 雷达", T.X(0) + 8, T.Y(0) + 4, C.muted, "left", "top");
    return;
  }
  const a = T.X(-2.3), b = T.X(2.3), c = T.Y(0.95), d = T.Y(-0.95);
  ctx.fillStyle = C.ego; ctx.fillRect(a, c, b - a, d - c);
  ctx.fillStyle = C.ink; ctx.beginPath();
  ctx.moveTo(T.X(0) + 6, T.Y(0)); ctx.lineTo(T.X(0) - 4, T.Y(0) - 5); ctx.lineTo(T.X(0) - 4, T.Y(0) + 5); ctx.fill();
  if (step === 0) tag("我的车，雷达 = 原点", a, d + 6, C.muted, "left", "top");
}

function color(lbl) { return C["c" + (lbl % 5)] || C.ink; }

function draw(now) {
  readColors();
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = C.surface; ctx.fillRect(0, 0, W, H);
  const P = pts(), S = stats(P);
  // view transition
  let vt = reduce ? 1 : Math.min(1, (now - vt0) / 650);
  const e = ease(vt);
  view = { x0: lerp(viewFrom.x0, viewTo.x0, e), x1: lerp(viewFrom.x1, viewTo.x1, e), y0: lerp(viewFrom.y0, viewTo.y0, e), y1: lerp(viewFrom.y1, viewTo.y1, e) };
  const T = fit(view);
  grid(T);
  drawEgo(T);

  const delay = step >= 1 && vt < 1 ? 650 : 0;
  const p = reduce ? 1 : Math.max(0, Math.min(1, (now - t0 - delay - 150) / 1400));
  const k = PICKS[pick].k;

  // background points (other clusters)
  if (pick !== "toy") {
    for (const q of ALL) {
      if (q[2] === k) continue;
      ctx.globalAlpha = step === 0 ? 0.55 : 0.12;
      ctx.fillStyle = q[2] < 0 ? C.muted : color(q[2]);
      ctx.beginPath(); ctx.arc(T.X(q[0]), T.Y(q[1]), 2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // sweep state
  let sweepX = null, sweepY = null;
  if (step === 2) sweepX = p < 1 ? lerp(T.left, S.x1 + (T.right - S.x1) * 0.0, ease(p)) : null;
  if (step === 3) sweepY = p < 1 ? lerp(T.bottom, S.y1, ease(p)) : null;
  const ptColor = pick === "toy" ? C.c4 : color(k);
  const r = step === 0 ? 2.4 : pick === "toy" ? 6 : 3;
  for (const q of P) {
    let a = 1;
    if (sweepX !== null && q[0] > sweepX) a = 0.3;
    if (sweepY !== null && q[1] > sweepY) a = 0.3;
    if (step === 5) a = 0.55;
    ctx.globalAlpha = a; ctx.fillStyle = ptColor;
    ctx.beginPath(); ctx.arc(T.X(q[0]), T.Y(q[1]), r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (pick === "toy" && step >= 1) {
    ctx.font = `11px ${C.font}`; ctx.fillStyle = C.muted; ctx.textAlign = "left"; ctx.textBaseline = "bottom";
    for (const q of P) ctx.fillText(`(${fn(q[0])}, ${fn(q[1])})`, T.X(q[0]) + 8, T.Y(q[1]) - 4);
  }

  if (step === 0) {
    const m = pick === "toy" ? 0.3 : 0.6;
    ctx.strokeStyle = C.ink; ctx.lineWidth = 1.2; ctx.setLineDash([4, 4]);
    ctx.strokeRect(T.X(S.x0 - m), T.Y(S.y1 + m), (S.L + 2 * m) * T.s, (S.Wd + 2 * m) * T.s); ctx.setLineDash([]);
    if (pick !== "toy") tag(`第 ${k} 堆：${P.length} 个点`, T.X(S.x1 + m) + 6, T.Y(S.y1 + m), C.ink, "left", "top");
  }

  // x overlays
  const xDone = step > 2 || (step === 2 && p >= 1);
  if (step === 2 && !xDone) {
    const scanned = P.filter(q => q[0] <= sweepX);
    vline(T, sweepX, C.xcol, [], 2.2);
    if (scanned.length) {
      const mx = Math.max(...scanned.map(q => q[0]));
      vline(T, S.x0, C.xcol); tag(`x 最小 ${f2(S.x0)}`, T.X(S.x0) - 4, 26, C.xcol, "right", "top");
      vline(T, mx, C.xcol, [2, 3]); tag(`目前最大 ${f2(mx)}`, T.X(mx) + 4, 48, C.xcol, "left", "top");
      ring(T, P[S.ix0], C.xcol);
    }
  }
  if (xDone && step >= 2 && step <= 4) {
    vline(T, S.x0, C.xcol); vline(T, S.x1, C.xcol);
    if (step !== 4) { tag(`x 最小 ${f2(S.x0)}`, T.X(S.x0) - 4, 26, C.xcol, "right", "top"); tag(`x 最大 ${f2(S.x1)}`, T.X(S.x1) + 4, 26, C.xcol, "left", "top"); }
    ring(T, P[S.ix0], C.xcol); ring(T, P[S.ix1], C.xcol);
    arrowH(T, S.x0, S.x1, T.Y(S.y0) + 26, C.xcol, `长 ${f2(S.L)}`);
  }
  // y overlays
  const yDone = step > 3 || (step === 3 && p >= 1);
  if (step === 3 && !yDone) {
    const scanned = P.filter(q => q[1] <= sweepY);
    hline(T, sweepY, C.ycol, [], 2.2);
    if (scanned.length) {
      const my = Math.max(...scanned.map(q => q[1]));
      hline(T, S.y0, C.ycol); tag(`y 最小 ${f2(S.y0)}`, W - 6, T.Y(S.y0) + 4, C.ycol, "right", "top");
      hline(T, my, C.ycol, [2, 3]); tag(`目前最大 ${f2(my)}`, W - 6, T.Y(my) - 4, C.ycol, "right", "bottom");
      ring(T, P[S.iy0], C.ycol);
    }
  }
  if (yDone && step >= 3 && step <= 4) {
    hline(T, S.y0, C.ycol); hline(T, S.y1, C.ycol);
    if (step !== 4) { tag(`y 最小 ${f2(S.y0)}`, W - 6, T.Y(S.y0) + 4, C.ycol, "right", "top"); tag(`y 最大 ${f2(S.y1)}`, W - 6, T.Y(S.y1) - 4, C.ycol, "right", "bottom"); }
    ring(T, P[S.iy0], C.ycol); ring(T, P[S.iy1], C.ycol);
    arrowV(T, S.y0, S.y1, T.X(S.x1) + 22, C.ycol, `宽 ${f2(S.Wd)}`);
  }
  // box
  if (step >= 4) {
    const bx = T.X(S.x0), by = T.Y(S.y1), bw = S.L * T.s, bh = S.Wd * T.s;
    const pb = step === 4 ? (reduce ? 1 : Math.min(1, (now - t0) / 500)) : 1;
    ctx.globalAlpha = (step === 5 ? 0.35 : 1) * pb;
    ctx.fillStyle = C.ink; ctx.globalAlpha *= 0.07; ctx.fillRect(bx, by, bw, bh);
    ctx.globalAlpha = (step === 5 ? 0.35 : 1) * pb;
    ctx.strokeStyle = C.ink; ctx.lineWidth = 2.2; ctx.strokeRect(bx, by, bw, bh);
    const X = T.X(S.cx), Y = T.Y(S.cy);
    ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(X - 9, Y); ctx.lineTo(X + 9, Y); ctx.moveTo(X, Y - 9); ctx.lineTo(X, Y + 9); ctx.stroke();
    ctx.globalAlpha = 1;
    if (step === 4) tag(`中心 (${f2(S.cx)}, ${f2(S.cy)})`, X + 12, Y + 12, C.ink, "left", "top");
  }
  // nearest / farthest
  if (step === 5) {
    const A = P[S.inear], B = P[S.ifar];
    const pr = reduce ? 1 : Math.min(1, (now - t0) / 900);
    ctx.strokeStyle = C.warn; ctx.lineWidth = 2; ctx.setLineDash([7, 5]);
    ctx.beginPath(); ctx.moveTo(T.X(A[0]), T.Y(A[1]));
    ctx.lineTo(T.X(lerp(A[0], B[0], pr)), T.Y(lerp(A[1], B[1], pr))); ctx.stroke(); ctx.setLineDash([]);
    ring(T, A, C.warn, 9); ring(T, B, C.warn, 9);
    tag(`离雷达最近 ${f2(S.dnear)} 米`, T.X(A[0]) - 12, T.Y(A[1]) - 12, C.warn, "right", "bottom");
    tag(`最远 ${f2(S.dfar)} 米`, T.X(B[0]) + 12, T.Y(B[1]) - 12, C.warn, "left", "bottom");
    if (pr >= 1) tag(`连线 ${f2(S.seg)} 米（斜线）`, (T.X(A[0]) + T.X(B[0])) / 2, (T.Y(A[1]) + T.Y(B[1])) / 2 + 12, C.warn, "center", "top");
  }
  const animating = vt < 1 || (step >= 2 && p < 1) || (step >= 4 && now - t0 < 950);
  if (animating) requestAnimationFrame(draw);
}

function kick() { requestAnimationFrame(draw); }

function render(resetView) {
  const P = pts(), S = stats(P);
  const T = texts(S, P.length);
  const ol = document.getElementById("steps");
  ol.innerHTML = "";
  T.forEach((t, i) => {
    const li = document.createElement("li");
    li.innerHTML = t; li.tabIndex = 0;
    if (i === step) li.setAttribute("aria-current", "step");
    li.addEventListener("click", () => go(i));
    li.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); go(i); } });
    ol.appendChild(li);
  });
  document.getElementById("readout").innerHTML = T[step];
  document.getElementById("stepno").textContent = `第 ${step + 1} / ${NSTEP} 步`;
  document.getElementById("prev").disabled = step === 0;
  document.getElementById("next").disabled = step === NSTEP - 1;
  const tv = targetView(S);
  viewFrom = resetView || !view ? tv : view;
  viewTo = tv; vt0 = performance.now(); t0 = performance.now();
  kick();
}
function go(i) { step = Math.max(0, Math.min(NSTEP - 1, i)); render(false); }

document.getElementById("prev").addEventListener("click", () => go(step - 1));
document.getElementById("next").addEventListener("click", () => go(step + 1));
document.getElementById("replay").addEventListener("click", () => { t0 = performance.now(); if (step === 1) { viewFrom = overView(); vt0 = t0; } kick(); });
document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
  pick = b.dataset.pick;
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c === b)));
  step = 0; render(true);
}));
window.addEventListener("resize", resize);
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", kick);
new MutationObserver(kick).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
resize();
render(true);
</script>

</body>
</html>
